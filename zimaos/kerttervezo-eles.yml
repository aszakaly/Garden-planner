# A Kerttervező éles példánya ZimaOS-alkalmazásként (a kezdőlapon is látszik).
# A kiadó parancs (npm run kiadas:eles) a __VERZIO__ helyére írja a verziót, a __LEMEZ__ és
# __DROPBOX__ helyére a külső mentés csatolási pontjait (a helyi scripts/zima/.zima-ból), és a
# casaos-cli-vel telepíti vagy frissíti. Az adatok a szerver lemezén maradnak.
name: kerttervezo-eles
services:
  kerttervezo-eles:
    image: ghcr.io/aszakaly/garden-planner:__VERZIO__
    container_name: kerttervezo-eles
    restart: unless-stopped
    ports:
      - target: 4321
        published: '4321'
        protocol: tcp
    environment:
      TZ: Europe/Budapest
      KERT_KULSO_MENTES: lemez=__LEMEZ__/Kerttervezo-mentes,dropbox=__DROPBOX__/Kerttervezo-mentes
    volumes:
      - type: bind
        source: /DATA/AppData/kerttervezo/eles
        target: /data
      # A /media mindig létezik; a lemez és a Dropbox ez alá csatolódik. Ha valamelyik nincs bekötve
      # (vagy később kapcsolódik), a példány ettől még elindul: a célt a jelölőfájl hiánya jelzi.
      # Az rslave miatt a konténer indulása után bekötött Dropboxot is látja.
      - type: bind
        source: /media
        target: /media
        bind:
          propagation: rslave
    x-casaos:
      ports:
        - container: '4321'
          description:
            en_us: Webes felület
      volumes:
        - container: /data
          description:
            en_us: Adatbázis és mentések
        - container: /media
          description:
            en_us: Külső mentés (4 TB-os lemez és Dropbox)
x-casaos:
  architectures:
    - amd64
  main: kerttervezo-eles
  category: Utilities
  author: aszakaly
  developer: aszakaly
  icon: https://raw.githubusercontent.com/aszakaly/Garden-planner/c9adfecd7424efcd84b2910798a6beed1add8f5e/src/client/public/icon-192.png
  tagline:
    en_us: Kert- és veteményes-tervező
  description:
    en_us: Kert- és veteményes-tervező és kertészeti napló. Ez az éles példány; csak a teszten már kipróbált verzió kerül ide.
  title:
    en_us: Kerttervező
    custom: Kerttervező
  index: /
  port_map: '4321'
  scheme: http
